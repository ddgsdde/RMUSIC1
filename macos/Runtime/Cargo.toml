[package]
name = "rmusic-mac-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
[dependencies]
rmusic-coreaudio = { path = "../AudioBackend" }
rmusic-audio = { path = "../../crates/audio" }
rmusic-bridge = { path = "../../crates/bridge", features = ["adaptive-sync"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","json","stream"] }
uuid = { version = "1", features = ["v4"] }

rmusic-desktop = { path = "../../apps/desktop/src-tauri", default-features = false }
sha2 = "0.10"
futures-util = "0.3"
libc = "0.2"

rmusic-discovery = { path = "../../crates/discovery" }

[dev-dependencies]
tempfile = "3"
