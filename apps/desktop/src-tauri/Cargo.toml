[package]
name = "rmusic-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
build = "build.rs"

[lib]
name = "rmusic_desktop"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rmusic-desktop"
path = "src/main.rs"
required-features = ["tauri-app"]

[features]
adaptive-sync = ["rmusic-audio/adaptive-sync", "rmusic-bridge/adaptive-sync"]
default = []
tauri-app = ["dep:tauri", "dep:tauri-build", "tauri/custom-protocol"]
asio-output = ["rmusic-audio/asio-output", "rmusic-bridge/asio-output"]

[dependencies]
rmusic-discovery = { path = "../../../crates/discovery" }
rmusic-bridge = { path = "../../../crates/bridge" }
rmusic-audio = { path = "../../../crates/audio" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tauri = { version = "2", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Networking_Connectivity", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }

[target.'cfg(target_os = "android")'.dependencies]
rmusic-audio = { path = "../../../crates/audio", features = ["format-conversion"] }
jni = "0.21"
ogg = "=0.8.0"
symphonia = { version = "=0.5.5", default-features = false, features = ["flac", "pcm", "wav", "alac", "isomp4", "mp3", "ogg", "vorbis", "aac"] }
