name: rmusic-nas
services:
  core:
    image: ${RMUSIC_IMAGE:-rmusic-core:0.1.0-preview.1}
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    network_mode: host
    environment:
      RMUSIC_BIND: 0.0.0.0
      RMUSIC_PORT: ${RMUSIC_NAS_PORT:-7800}
      RMUSIC_PUBLIC_URL: ${RMUSIC_NAS_PUBLIC_URL:?Set RMUSIC_NAS_PUBLIC_URL to your NAS LAN address}
      RMUSIC_DISCOVERY: "1"
      RMUSIC_CACHE_ENABLED: "1"
      RMUSIC_BACKUP_DIR: /backups
    volumes:
      - rmusic-data:/data
      - rmusic-cache:/cache
      - rmusic-backups:/backups
      - "${RMUSIC_NAS_MUSIC_DIR:-./music}:/music:ro"
volumes:
  rmusic-data:
  rmusic-cache:
  rmusic-backups:
