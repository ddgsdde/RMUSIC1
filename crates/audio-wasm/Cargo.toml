[package]
name = "rmusic-audio-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustfft = { version = "6.4.1", features = ["wasm_simd"] }
