[package]
name = "rmusic-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
adaptive-sync = ["dep:rubato", "dep:audioadapter-buffers"]
format-conversion = ["dep:rubato", "dep:audioadapter-buffers"]
alsa-output = ["dep:alsa", "dep:dbus"]
asio-output = ["dep:asio-sys", "dep:cc"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
realfft = "3.5.0"
rubato = { version = "=5.0.1", default-features = false, optional = true }
audioadapter-buffers = { version = "=5.1.0", default-features = false, optional = true }
tokio = { version = "1", features = ["process", "time", "io-util", "rt"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
asio-sys = { version = "=0.4.0", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.12.1", optional = true }
dbus = { version = "=0.9.12", features = ["vendored"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "adaptive-rate-bench"
required-features = ["adaptive-sync"]
