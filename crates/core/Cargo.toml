[package]
name = "rmusic-core"
version.workspace = true
edition.workspace = true

[dependencies]
rmusic-discovery = { path = "../discovery" }
rmusic-remote = { path = "../remote" }
zeroize = "1"
rmusic-audio = { path = "../audio" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
libc = "0.2"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
lofty = "0.22"
walkdir = "2"
jieba-rs = "0.8"
pinyin = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
mime_guess = "2"
anyhow = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
semver = "1"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", features = ["ring"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
